plugins {
    id 'com.android.application'
}

android {
    namespace 'com.etisalatcash.gateway'
    compileSdk 34

    defaultConfig {
        applicationId "com.etisalatcash.gateway"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'gateway123456'
            keyAlias 'gateway'
            keyPassword 'gateway123456'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
